# Skill roots that install.sh publishes to, one per line: MODE:PATH
#
#   link  symlink each skill dir (edits go live immediately)
#   copy  real copy with a marker file, for tools that ignore symlinks;
#         re-run install.sh after editing a skill
#
# A root is skipped when its parent directory is missing, so tools that are
# not installed on this machine are ignored. To try a new tool, add its skill
# root here and run ./install.sh. `~` expands to $HOME.

# Claude Code (CLI, desktop app, IDE extensions)
link:~/.claude/skills

# Harness-agnostic root, read by Codex and other .agents-aware tools.
# Shared with the `npx skills` CLI; install.sh never touches entries it does not own.
link:~/.agents/skills

# bb ignores symlinked skill dirs, so it gets copies.
copy:~/.bb/skills

# Unverified. Uncomment after confirming the tool's skill root and whether it
# follows symlinks. (OpenCode also reads ~/.claude/skills, so it may not need its own.)
# link:~/.config/opencode/skills
# link:~/.cursor/skills
